services:
  ekravo-review:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ekravo-review:latest
    container_name: ekravo-review
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/ekravo-review.db
      CONTEXT_CACHE_DIR: /data/.ekravo-context
    ports:
      - "${WEBHOOK_PORT:-8090}:8090"
    volumes:
      - ./data:/data
      # Optional: GitHub App private keys and other secrets.
      - ./secrets:/data/secrets:ro
